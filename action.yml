name: flakewatch
description: Comment CI cost and flakiness on pull requests that change workflow files.
author: karanmonu

branding:
  icon: activity
  color: orange

inputs:
  github-token:
    description: >-
      Token used to read Actions data and post the comment. Needs actions:read
      and pull-requests:write. Note that pull_request runs from forks get a
      read-only token, so the comment step is skipped there.
    required: false
    default: ${{ github.token }}
  runs:
    description: >-
      How many recent workflow runs to analyze. Each run costs one API request,
      and inside Actions the GITHUB_TOKEN budget is roughly 1,000 requests an
      hour shared with every other workflow in the repository. The default is
      deliberately small so that several pull requests in an hour cannot drain
      it. Raise it on quiet repositories.
    required: false
    default: "50"
  since:
    description: >-
      Time window to analyze, e.g. 30d. A fixed window keeps the monthly
      projection from moving between runs, which a fixed run count does not.
      The runs input still caps how many requests this can cost, and the
      comment says so when the cap is reached before the window is covered.
      Set to an empty string to go back to a plain run count.
    required: false
    default: 30d
  version:
    description: flakewatch release to use.
    required: false
    default: v0.3.0
  always-comment:
    description: >-
      Comment on every pull request rather than only those touching
      .github/workflows. Off by default: a bot that comments on everything
      gets muted.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    # Every step below ends in exit 0. This action reports; it does not judge.
    # A red check on someone's pull request because a reporting tool could not
    # reach a release asset is a bad trade, so failures become annotations and
    # the remaining steps skip themselves.
    - name: Check whether this PR touches workflows
      id: changed
      shell: bash
      env:
        ALWAYS: ${{ inputs.always-comment }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        set -uo pipefail
        if [ -z "${BASE_SHA:-}" ]; then
          echo "::warning::flakewatch found no pull request context; skipping."
          echo "relevant=false" >> "$GITHUB_OUTPUT"; exit 0
        fi
        if [ "$ALWAYS" = "true" ]; then
          echo "relevant=true" >> "$GITHUB_OUTPUT"; exit 0
        fi
        # Requires the base commit locally: check out with fetch-depth: 0.
        if ! git cat-file -e "$BASE_SHA" 2>/dev/null; then
          echo "::warning::Base commit not available. Check out with fetch-depth: 0 to enable workflow-change detection. Commenting anyway."
          echo "relevant=true" >> "$GITHUB_OUTPUT"; exit 0
        fi
        files=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" | grep '^\.github/workflows/' | paste -sd, -)
        if [ -n "$files" ]; then
          echo "relevant=true" >> "$GITHUB_OUTPUT"
          # Passed to -changed so the comment leads with the workflows this pull
          # request edits rather than the whole repository's bill.
          echo "files=$files" >> "$GITHUB_OUTPUT"
          echo "Changed workflows: $files"
        else
          echo "relevant=false" >> "$GITHUB_OUTPUT"
          echo "No workflow files changed; nothing to report."
        fi

    - name: Install flakewatch
      id: install
      if: steps.changed.outputs.relevant == 'true'
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        set -uo pipefail
        url="https://github.com/karanmonu/flakewatch/releases/download/${VERSION}/flakewatch_linux_amd64.tar.gz"
        if ! curl -fsSL --retry 2 --retry-delay 2 "$url" | tar xz -C /tmp flakewatch; then
          echo "::warning::flakewatch ${VERSION} could not be downloaded; skipping the report."
          echo "ok=false" >> "$GITHUB_OUTPUT"; exit 0
        fi
        chmod +x /tmp/flakewatch
        /tmp/flakewatch -version
        echo "ok=true" >> "$GITHUB_OUTPUT"

    - name: Analyze
      id: analyze
      if: steps.install.outputs.ok == 'true'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        RUNS: ${{ inputs.runs }}
        SINCE: ${{ inputs.since }}
        CHANGED: ${{ steps.changed.outputs.files }}
        REPO: ${{ github.repository }}
      run: |
        set -uo pipefail
        if ! /tmp/flakewatch -repo "$REPO" -runs "$RUNS" -since "$SINCE" -changed "$CHANGED" -markdown > /tmp/flakewatch-comment.md 2> /tmp/flakewatch-err.txt; then
          echo "::warning::flakewatch could not analyze $REPO: $(head -c 400 /tmp/flakewatch-err.txt)"
          echo "ok=false" >> "$GITHUB_OUTPUT"; exit 0
        fi
        if [ ! -s /tmp/flakewatch-comment.md ]; then
          echo "::warning::flakewatch produced an empty report; nothing to comment."
          echo "ok=false" >> "$GITHUB_OUTPUT"; exit 0
        fi
        cat /tmp/flakewatch-comment.md >> "$GITHUB_STEP_SUMMARY"
        echo "ok=true" >> "$GITHUB_OUTPUT"

    - name: Comment on the pull request
      if: steps.analyze.outputs.ok == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        PR: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
      run: |
        set -uo pipefail
        # Build the JSON body with jq rather than relying on shell quoting -
        # the comment contains backticks, quotes and newlines.
        if ! jq -Rs '{body: .}' /tmp/flakewatch-comment.md > /tmp/flakewatch-payload.json; then
          echo "::warning::Could not build the comment payload; the report is in the job summary."
          exit 0
        fi

        existing=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \\
          --jq 'map(select(.body | startswith("<!-- flakewatch:report -->"))) | .[0].id // empty') || existing=""

        if [ -n "$existing" ]; then
          if gh api -X PATCH "repos/$REPO/issues/comments/$existing" --input /tmp/flakewatch-payload.json >/dev/null; then
            echo "Updated existing comment $existing"
          else
            echo "::warning::Could not update comment $existing. The report is in the job summary."
          fi
        elif gh api -X POST "repos/$REPO/issues/$PR/comments" --input /tmp/flakewatch-payload.json >/dev/null; then
          echo "Posted a new comment"
        else
          # Pull requests from forks get a read-only token. That is by design,
          # not a misconfiguration, so it should not read as a failure.
          echo "::warning::Could not post the comment. Forked pull requests get a read-only token; the report is in the job summary."
        fi
        exit 0
