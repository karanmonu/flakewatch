name: flakewatch
description: Comment CI cost and flakiness on pull requests that change workflow files.
author: karanmonu

branding:
  icon: activity
  color: orange

inputs:
  github-token:
    description: >-
      Token used to read Actions data and post the comment. Needs actions:read
      and pull-requests:write. Note that pull_request runs from forks get a
      read-only token, so the comment step is skipped there.
    required: false
    default: ${{ github.token }}
  runs:
    description: How many recent workflow runs to analyze.
    required: false
    default: "200"
  version:
    description: flakewatch release to use.
    required: false
    default: v0.2.0
  always-comment:
    description: >-
      Comment on every pull request rather than only those touching
      .github/workflows. Off by default: a bot that comments on everything
      gets muted.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Check whether this PR touches workflows
      id: changed
      shell: bash
      env:
        ALWAYS: ${{ inputs.always-comment }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        set -uo pipefail
        if [ "$ALWAYS" = "true" ]; then
          echo "relevant=true" >> "$GITHUB_OUTPUT"; exit 0
        fi
        # Requires the base commit locally: check out with fetch-depth: 0.
        if ! git cat-file -e "$BASE_SHA" 2>/dev/null; then
          echo "::warning::Base commit not available. Check out with fetch-depth: 0 to enable workflow-change detection. Commenting anyway."
          echo "relevant=true" >> "$GITHUB_OUTPUT"; exit 0
        fi
        if git diff --name-only "$BASE_SHA" "$HEAD_SHA" | grep -q '^\.github/workflows/'; then
          echo "relevant=true" >> "$GITHUB_OUTPUT"
        else
          echo "relevant=false" >> "$GITHUB_OUTPUT"
          echo "No workflow files changed; nothing to report."
        fi

    - name: Install flakewatch
      if: steps.changed.outputs.relevant == 'true'
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        url="https://github.com/karanmonu/flakewatch/releases/download/${VERSION}/flakewatch_linux_amd64.tar.gz"
        curl -fsSL "$url" | tar xz -C /tmp flakewatch
        chmod +x /tmp/flakewatch
        /tmp/flakewatch -version

    - name: Analyze
      if: steps.changed.outputs.relevant == 'true'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        RUNS: ${{ inputs.runs }}
        REPO: ${{ github.repository }}
      run: |
        set -euo pipefail
        /tmp/flakewatch -repo "$REPO" -runs "$RUNS" -markdown > /tmp/flakewatch-comment.md
        cat /tmp/flakewatch-comment.md >> "$GITHUB_STEP_SUMMARY"

    - name: Comment on the pull request
      if: steps.changed.outputs.relevant == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        PR: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
      run: |
        set -euo pipefail
        # Build the JSON body with jq rather than relying on shell quoting -
        # the comment contains backticks, quotes and newlines.
        jq -Rs '{body: .}' /tmp/flakewatch-comment.md > /tmp/flakewatch-payload.json

        existing=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
          --jq 'map(select(.body | startswith("<!-- flakewatch:report -->"))) | .[0].id // empty')

        if [ -n "$existing" ]; then
          gh api -X PATCH "repos/$REPO/issues/comments/$existing" --input /tmp/flakewatch-payload.json >/dev/null
          echo "Updated existing comment $existing"
        else
          gh api -X POST "repos/$REPO/issues/$PR/comments" --input /tmp/flakewatch-payload.json >/dev/null
          echo "Posted a new comment"
        fi
