# Temporary: applies gofmt and commits the result. Deleted once it has run.
name: Fmt

on:
  push:
    branches: [honest-window]

permissions:
  contents: write

jobs:
  gofmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: gofmt -l -w .
      - name: Commit
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain)" ]; then
            echo "Already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "style: gofmt"
          git push
