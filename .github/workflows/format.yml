# One-off: runs gofmt across the tree and commits the result.
#
# The repository was never gofmt-clean -- the CI check that revealed it was
# added in the same pull request as this file. Both this file and the trigger
# below are removed once it has run.
name: Format

on:
  push:
    branches: [pr-scoped-window]

permissions:
  contents: write

jobs:
  gofmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Run gofmt
        run: |
          set -euo pipefail
          gofmt -l -w .
      - name: Commit
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain)" ]; then
            echo "Already formatted; nothing to do."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "style: gofmt the tree"
          git push
