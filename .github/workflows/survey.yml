# Runs flakewatch against a handful of well-known public repositories so the
# README can quote measured output rather than an invented example, and so
# anyone can reproduce that table. Run it from the Actions tab.
#
# Public repositories' Actions history is public, so GITHUB_TOKEN is here for
# the rate limit rather than for access. Each repo costs about 51 requests at
# -runs 200. History is cached between dispatches via actions/cache, so the
# first survey pays full price and later ones widen the windows almost free.
name: Survey

on:
  workflow_dispatch:

jobs:
  survey:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      # The survey's own dogfooding of the history cache. A runner is fresh
      # every dispatch, so without this the survey re-pays for every run it has
      # ever measured and each window is capped at whatever -runs 200 reaches
      # in one go. Restoring it means each dispatch adds a day for the price of
      # that day's new runs, and after a week the table covers a real week.
      - uses: actions/cache@v4
        with:
          path: .fwcache
          key: flakewatch-survey-${{ github.run_id }}
          restore-keys: flakewatch-survey-

      - name: Analyze several public repositories
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          go build -o /tmp/flakewatch .
          for repo in \
            grafana/k6 \
            gohugoio/hugo \
            cli/cli \
            rs/zerolog \
            golangci/golangci-lint \
            prometheus/prometheus \
            hashicorp/terraform \
            vitejs/vite
          do
            echo "::group::$repo"
            /tmp/flakewatch -repo "$repo" -runs 200 -since 30d -cost -cache-dir "$GITHUB_WORKSPACE/.fwcache" || echo "(failed for $repo)"
            echo "::endgroup::"
          done
